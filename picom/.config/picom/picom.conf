backend = "glx";
glx-use-copysubbuffer-mesa = true;

glx-copy-from-front = true;
glx-swap-method = 2;
xrender-sync = true;
xrender-sync-fence = true;

shadow = false;
fading = true;
fade-delta = 5;

inactive-opacity = 0.7;
detect-transient = true;
transparent-clipping = true;

transparent-clipping-exclude = [
  "window_type = 'dock'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'i3lock'",
  "name *= 'Chrome'"
]

focus-exclude = [
  "window_type = 'dock'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'i3lock'",
  "name *= 'Chrome'"
];

