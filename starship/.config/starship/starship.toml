"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
format = '$hostname${custom.colima_up}$directory$git_branch$fill$time$line_break$character'
command_timeout = 1000

[hostname]
ssh_only = false
ssh_symbol = '[ ](fg:#bb9af7)'
format = '$ssh_symbol[$hostname](fg:8) '
trim_at = '.'
disabled = false

[directory]
truncation_length = 5
truncate_to_repo = false
style = 'fg:4'

[git_branch]
symbol = '󰘬 '
style = 'fg:8'
format = '[$symbol$branch(:$remote_branch)]($style) '
ignore_branches = []

[character]
success_symbol = '[󰁕](fg:#73daca)'
error_symbol = '[󰁕](fg:1)'
vimcmd_symbol = '[󰁎](fg:8)'

[fill]
symbol = ' '

[time]
disabled = false
format = '[$time](fg:8)'
time_format = '%-d-%b-%Y %R'

[custom.colima_up]
os = "macos"
when = "colima status"
command = "echo  "
format = "[$output ]($style) "
style = "fg:4"
